short_description: "理解视频内容：提取关键帧、转录语音，再用多模态模型图文结合分析。"
when_to_use: "当用户上传视频，或要求理解 / 总结 / 分析视频内容时使用。视频中的板书文字可用来纠正语音转录里的同音术语错误。"
input_format: "{\"video_path\": \"视频文件路径\", \"language\": \"转录语言（默认 zh）\", \"max_frames\": \"最大关键帧数量（默认 72）\", \"analysis_prompt\": \"可选的自定义分析提示词\"}。"
guideline: "视频相关问题优先用此工具获取内容分析；工具返回的是结构化的内容摘要（含主题、章节划分、关键概念、术语纠正），可在此基础上结合用户需求作答。"
note: "处理视频需要一定时间，大型视频更久；工具内部会保留临时产物供调试。"
phase: "exploration"
